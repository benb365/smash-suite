[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "smash-suite"
version = "0.2.0"
description = "Local badminton video modules and applications."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "av==14.2.0",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "scipy==1.13.1",
  "ultralytics==8.4.56",
  "filelock>=3.12",
  "requests==2.32.5",
  "imageio-ffmpeg==0.6.0",
  "lap>=0.5.12"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.4",
  "pyinstaller==6.16.0"
]

[tool.pytest.ini_options]
pythonpath = [".", "apps/video-clipper/backend"]
testpaths = ["modules", "apps/video-clipper/backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.setuptools.packages.find]
include = ["modules*"]
namespaces = false

[tool.setuptools.package-data]
"modules.rally.scenarios" = ["*.json"]
"modules.rally.experiments" = ["cases.json"]
"modules.models.tracknet" = ["LICENSE.txt"]
